<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notice frame</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f0d20; overflow: hidden; }
  .nav { height: 56px; border-bottom: 1px solid #ffffff12; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; padding: 18px 18px 0 70px; }
  .grid div { aspect-ratio: 2 / 3; border-radius: 10px; background: #2a2550; }
  .grid div:nth-child(3n) { background: #352c5e; }
</style>
</head>
<body>
<div class="nav"></div>
<div class="grid"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
<script src="../extension/notice.js"></script>
<script src="notice-cases.js"></script>
<script>
  // ?case=<id>&lang=en|ar&anim=1
  (async () => {
    const q = new URLSearchParams(location.search);
    const c = await window.loadNoticeCase(q.get('case'));
    const run = () => window.__stremioPotPlayerNoticeTest.showNotice({
      ...c, lang: q.get('lang') || 'en', instant: q.get('anim') !== '1',
      onAction: (a) => { parent.postMessage({ noticeAction: a, case: q.get('case') }, '*'); if (q.get('anim') === '1') setTimeout(run, 800); },
    });
    run();
  })();
</script>
</body>
</html>
