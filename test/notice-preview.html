<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notice preview</title>
<style>
  body { margin: 0; background: #08070f; color: #ddd; font: 14px/1.5 "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 16px; background: #14122a; border-bottom: 1px solid #ffffff14; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: 6px; align-items: center; }
  legend { float: left; margin-right: 6px; color: #aaa; }
  button { background: #ffffff10; color: #ddd; border: 1px solid #ffffff22; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button[aria-pressed="true"] { background: #7b5bf5; border-color: #7b5bf5; color: #fff; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); gap: 20px; padding: 16px; }
  figure { margin: 0; }
  figcaption { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  .frame { width: var(--fw); height: var(--fh); overflow: hidden; border-radius: 8px; border: 1px solid #ffffff1a; }
  .frame iframe { width: var(--vw); height: var(--vh); border: 0; transform: scale(var(--s)); transform-origin: 0 0; display: block; }
  #big { position: fixed; inset: 0; z-index: 5; background: #000c; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  #big.open { display: flex; }
  #big iframe { width: min(1280px, 96vw); height: min(720px, 80vh); border: 1px solid #ffffff22; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>Notice preview</h1>
  <fieldset id="lang"><legend>Language</legend><button data-v="en" aria-pressed="true">English</button><button data-v="ar">العربية</button></fieldset>
  <fieldset id="size"><legend>Screen</legend><button data-v="1280x720" aria-pressed="true">1280×720</button><button data-v="1920x1080">1920×1080</button><button data-v="800x500">800×500</button><button data-v="390x740">Phone 390×740</button></fieldset>
</header>
<main id="grid"></main>
<div id="big"><iframe title="Animated notice"></iframe><button id="big-close">Close</button></div>
<script src="notice-cases.js"></script>
<script>
  let lang = 'en', size = '1280x720';
  const grid = document.getElementById('grid');
  function pick(group, cb) {
    document.querySelectorAll(`#${group} button`).forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll(`#${group} button`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      cb(b.dataset.v); render();
    }));
  }
  pick('lang', (v) => { lang = v; });
  pick('size', (v) => { size = v; });

  function render() {
    const [vw, vh] = size.split('x').map(Number);
    const cell = vw < 500 ? 220 : 520;
    const s = cell / vw;
    document.documentElement.style.cssText = `--cell:${cell}px;--vw:${vw}px;--vh:${vh}px;--s:${s};--fw:${Math.round(vw * s)}px;--fh:${Math.round(vh * s)}px`;
    grid.replaceChildren(...window.NOTICE_CASES.map((c) => {
      const fig = document.createElement('figure');
      const cap = document.createElement('figcaption');
      const name = document.createElement('span');
      name.textContent = c.label;
      const play = document.createElement('button');
      play.textContent = 'Animate';
      play.addEventListener('click', () => {
        document.querySelector('#big iframe').src = `notice-frame.html?case=${c.id}&lang=${lang}&anim=1`;
        document.getElementById('big').classList.add('open');
      });
      cap.append(name, play);
      const box = document.createElement('div');
      box.className = 'frame';
      const f = document.createElement('iframe');
      f.title = c.label;
      f.loading = 'lazy';
      f.src = `notice-frame.html?case=${c.id}&lang=${lang}`;
      box.append(f);
      fig.append(cap, box);
      return fig;
    }));
  }
  document.getElementById('big-close').addEventListener('click', () => {
    document.getElementById('big').classList.remove('open');
    document.querySelector('#big iframe').src = 'about:blank';
  });
  render();
</script>
</body>
</html>
